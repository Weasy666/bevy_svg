<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="300" height="290" viewBox="0 0 300 290" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <linearGradient id="white-to-black" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff"/>
            <stop offset="1" stop-color="#000"/>
        </linearGradient>
        <radialGradient id="focal" cx="0.5" cy="0.5" r="0.5" fx="0.3" fy="0.3">
            <stop offset="0" stop-color="yellow"/>
            <stop offset="0.5" stop-color="red"/>
            <stop offset="1" stop-color="blue"/>
        </radialGradient>
        <linearGradient id="reflect" x1="0" y1="0" x2="0.25" y2="0" spreadMethod="reflect">
            <stop offset="0" stop-color="#0f0"/>
            <stop offset="1" stop-color="#00f"/>
        </linearGradient>
        <linearGradient id="repeat" x1="0" y1="0" x2="0.25" y2="0.25" spreadMethod="repeat" gradientTransform="rotate(20)">
            <stop offset="0" stop-color="#f0f"/>
            <stop offset="0.5" stop-color="#ff0" stop-opacity="0.3"/>
            <stop offset="1" stop-color="#0ff"/>
        </linearGradient>
        <radialGradient id="focal-radius" cx="0.5" cy="0.5" r="0.5" fr="0.25">
            <stop offset="0" stop-color="#fff"/>
            <stop offset="1" stop-color="#f60"/>
        </radialGradient>
        <linearGradient id="stroke" x1="205" y1="0" x2="285" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#0cf"/>
            <stop offset="1" stop-color="#f0c"/>
        </linearGradient>
        <!-- Inherits the stops of `stroke`, but fades out vertically. -->
        <linearGradient id="fade" x1="0" y1="1" x2="0" y2="0" xlink:href="#stroke" gradientUnits="objectBoundingBox"/>
        <!-- The focal point lies on the edge of the circle, in user space coordinates. -->
        <radialGradient id="focal-edge" cx="140.3" cy="235.3" r="40.9" fx="181.2" fy="235.3" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="yellow"/>
            <stop offset="0.5" stop-color="red"/>
            <stop offset="1" stop-color="blue"/>
        </radialGradient>
        <!-- Inspired by https://dev.w3.org/SVG/tools/svgweb/samples/svg-files/radialgradient1.svg:
             a reflected radial gradient with a non-uniform `gradientTransform`, which takes its
             stops from a linear gradient via `href`. -->
        <linearGradient id="gray">
            <stop offset="0" stop-color="#333"/>
            <stop offset="1" stop-color="#ccc"/>
        </linearGradient>
        <radialGradient id="ripples" xlink:href="#gray" cx="55" cy="235" r="7" spreadMethod="reflect" gradientUnits="userSpaceOnUse" gradientTransform="matrix(0.8 0 0 1.25 11 -58.75)"/>
        <!-- Inspired by https://dev.w3.org/SVG/tools/svgweb/samples/svg-files/radialgradient2.svg:
             a linear and a radial gradient sharing a composed `gradientTransform`, which take their
             stops from a radial gradient via `href`. The focal point lies just inside the circle. -->
        <radialGradient id="blue-red">
            <stop offset="0" stop-color="#00f"/>
            <stop offset="1" stop-color="#f00"/>
        </radialGradient>
        <linearGradient id="tilted" xlink:href="#blue-red" x1="205" y1="212.5" x2="285" y2="212.5" gradientUnits="userSpaceOnUse" gradientTransform="translate(245 235) scale(1.1) rotate(30) scale(0.9) translate(-245 -235)"/>
        <radialGradient id="focal-inside" xlink:href="#blue-red" cx="230" cy="257.5" r="20.14" fx="250" fy="257.5" gradientUnits="userSpaceOnUse" gradientTransform="translate(245 235) scale(1.1) rotate(30) scale(0.9) translate(-245 -235)"/>
    </defs>

    <!-- Linear: white to black -->
    <rect x="15" y="15" width="80" height="80" fill="url(#white-to-black)"/>
    <!-- Radial with a focal point and multiple stops -->
    <rect x="110" y="15" width="80" height="80" fill="url(#focal)"/>
    <!-- Linear with `spreadMethod="reflect"` -->
    <rect x="205" y="15" width="80" height="80" fill="url(#reflect)"/>

    <!-- Linear with `spreadMethod="repeat"`, a `gradientTransform` and a translucent stop,
         stroked with a gradient as well -->
    <circle cx="55" cy="145" r="36" fill="url(#repeat)" stroke="url(#white-to-black)" stroke-width="6"/>
    <!-- Radial with a focal radius (`fr`) and `fill-opacity` -->
    <rect x="110" y="105" width="80" height="80" rx="12" fill="url(#focal-radius)" fill-opacity="0.8"/>
    <!-- Gradient strokes, the second one inherits its stops via `href` -->
    <polyline points="205,110 225,140 245,110 265,140 285,110" fill="none" stroke="url(#stroke)" stroke-width="6" stroke-linejoin="round"/>
    <rect x="205" y="150" width="80" height="35" fill="url(#fade)"/>

    <!-- Radial with the focal point on the edge of the circle: the gradient only covers the
         half-plane on the side of the center, the strip on the right stays unpainted -->
    <rect x="110" y="195" width="80" height="80" fill="url(#focal-edge)"/>
    <!-- Reflected radial on an even-odd path with a hole, with a fallback color and a translucent
         stroke -->
    <path d="M 25,235 A 30,38 0 1 1 85,235 A 30,38 0 1 1 25,235 Z M 36,235 A 11,11 0 1 0 58,235 A 11,11 0 1 0 36,235 Z" fill="url(#ripples) black" fill-rule="evenodd" stroke="#000" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- Linear and radial with a composed `gradientTransform` -->
    <rect x="205" y="195" width="80" height="35" fill="url(#tilted)"/>
    <rect x="205" y="240" width="80" height="35" fill="url(#focal-inside)"/>
</svg>
